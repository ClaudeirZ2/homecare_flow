# Configuração da API no Render (https://render.com) — plano gratuito.
# No painel do Render: New > Blueprint > escolher este repositório.
# As variáveis marcadas com "sync: false" eu preencho no painel (são secretas).
services:
  - type: web
    name: homecare-flow-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: TZ
        value: America/Sao_Paulo
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: homecare_flow
      - key: DB_SSL
        value: "true"
      - key: DB_CA_CERT
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGIN
        sync: false
